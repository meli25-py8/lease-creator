[project]
name = "python-bib-app"
version = "0.1.0"
description = "Создание договора аренды с распознаванием удостоверения личности"
readme = "README_RU.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0,<2.0.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "opencv-python>=4.8",
]

[tool.flet]
product = "Создание договора"
icon = "assets/icon.png"

[tool.flet.app]
path = "."
module = "app.py"
include = ["contract_source.docx"]

[tool.flet.android]
min_sdk_version = 23

